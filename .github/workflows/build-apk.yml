name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK Platform, NDK, CMake & Build Tools
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter "sdkmanager.bat" | Select-Object -First 1 -ExpandProperty FullName
          echo y | & $sdkManager --licenses
          echo y | & $sdkManager --install "platforms;android-35" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1"
        shell: pwsh

      - name: Set Environment Variables
        run: |
          $ndkPath = "$env:ANDROID_HOME\ndk\29.0.13113456"
          echo "ANDROID_NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
          echo "NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Debug APK via PowerShell
        run: |
          .\tools\build_android.ps1 -Variant Debug
        shell: pwsh

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: manager/build/outputs/apk/debug/*.apk

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          

      - name: Install Android SDK Platform, NDK, CMake & Build Tools
        run: |
          echo y | %ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat --install "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1"
        shell: cmd

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Copy server.properties if needed
        run: |
          if (Test-Path "server.properties.example") { if (-not (Test-Path "server.properties")) { Copy-Item "server.properties.example" "server.properties" } }
          if (Test-Path "server\server.properties.example") { if (-not (Test-Path "server\server.properties")) { Copy-Item "server\server.properties.example" "server\server.properties" } }
        shell: pwsh

      - name: Build Debug APK
        run: |
          .\tools\build_android.ps1 -Variant Debug
        shell: pwsh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
