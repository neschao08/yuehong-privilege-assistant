name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Platform, NDK, CMake & Build Tools
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter "sdkmanager.bat" | Select-Object -First 1).FullName
          if (-not $sdk) { $sdk = "C:\Android\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat" }
          "y`n" * 20 | & $sdk --licenses
          & $sdk --install "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1" "platforms;android-35"
          try { & $sdk --install "platforms;android-37" } catch { Write-Host "android-37 not available, continuing..." }

      - name: Set Environment Variables
        shell: pwsh
        run: |
          $ndkPath = "$env:ANDROID_HOME\ndk\29.0.13113456"
          echo "ANDROID_NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
          echo "NDK_HOME=$ndkPath" >> $env:GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Debug APK via PowerShell
        shell: pwsh
        run: |
          .\tools\build_android.ps1 -Variant Debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            manager/build/outputs/apk/debug/*.apk
            **/*.apk
